[project]
name = "youtube-recorder"
version = "0.4.1"
description = "YouTube Recorder - YouTube subscription discovery, transcription orchestration and Obsidian ingestion. By Leoluchino."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "certifi",
    "keyring>=24",
    # 严格说这几个是 gui.py/visuals.py 用的，但它们跟核心网页界面/截图
    # 召回功能一样，从来不是"可选模组"——之前只是因为开发机上早就装好了
    # 才没人发现 pyproject.toml 里其实从没声明过它们；这次 Windows CI
    # 用一台全新机器跑 `pip install -e .` 才第一次暴露出来
    # （ModuleNotFoundError: No module named 'flask'）。
    "flask>=3.0",
    "markdown>=3.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pipeline = ["yt-dlp>=2026.1.1"]
ai = ["anthropic>=0.40", "openai>=1.50"]
dossier = ["yfinance>=0.2"]
# 原生窗口壳（winapp.py）——跨平台：macOS 上走 WKWebView，Windows 上走
# Edge WebView2（系统自带，Win10 1803+/Win11 都有）。
gui = ["pywebview>=5.0"]
# 菜单栏托盘常驻（tray.py）目前整个绑死 Cocoa，只有 macOS 能装/能用；
# Windows 版还没有对应实现（等做了大概会是 pystray），先别在 Windows 上
# 装这一组，装了也用不上、pip 还会直接装不上。
macos = ["rumps>=0.4", "pyobjc-framework-Cocoa>=10.0",
        "pyobjc-framework-WebKit>=10.0", "pyobjc-framework-Quartz>=10.0"]

[project.scripts]
ytrec = "youtube_recorder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["youtube_recorder*"]

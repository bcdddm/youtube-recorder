name: Build Windows

# First Windows build pass — minimum-viable scope: core Flask+webview app
# only (no tray/scheduler yet, see youtube_recorder/tray.py and scheduler.py
# docstrings). Runs entirely on GitHub's windows-latest runner since
# PyInstaller can't cross-compile — a macOS host can never produce a real,
# verified Windows .exe, it has to actually build (and ideally run the test
# suite) on Windows itself.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      # Windows 默认按系统 ANSI 代码页（往往是 cp1252）而不是 UTF-8 打开
      # 文本文件/标准输出，这个项目里到处是中文注释/UI 文案/文件内容，
      # 不强制 UTF-8 模式会在写中文内容的地方随机崩成
      # UnicodeEncodeError（第一次 CI 跑就踩到了）。已经把代码里能找到的
      # 具体调用点都显式传了 encoding="utf-8"，这里再加一层兜底，防止
      # 漏网的调用点。
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pipeline,ai,dossier,gui]"
          pip install pyinstaller pytest

      - name: Run test suite
        # 每个测试文件单独起一个 pytest 进程——不是随便挑的写法：paths.py
        # 的 APP_SUPPORT 之类是模块第一次被 import 时就算死的常量，几个
        # 测试文件各自把 YTREC_HOME 指到自己的临时目录，要是全塞进同一个
        # pytest 进程跑，后导入的文件设的 YTREC_HOME 改不动已经算好的值，
        # 会互相污染。分开跑的开销可忽略，换来的是每个文件各自隔离。
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tests -Filter "test_*.py" | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python -m pytest $_.FullName -q
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Build
        shell: pwsh
        run: ./scripts/build_app_windows.ps1

      - name: Smoke test the packaged exe
        # 光打包成功不代表真的能跑——PyInstaller 最常见的坑就是漏收了某个
        # 运行时才 import 的模块，打包时不报错，双击就闪退。--version 走的
        # 是 argparse 的内置 action，不碰 winapp/webview，也不用真开一个
        # 窗口（CI 这台机器上有没有 WebView2/能不能起窗口都不影响这一步），
        # 但只要它能正常打印退出，就说明整个可执行文件里的解释器、
        # youtube_recorder 包本身、以及它默认就要 import 的那些依赖
        # （flask/yaml/keyring 等）都是完整能跑起来的。
        #
        # 用 `& $exe` 直接调用第一次跑就翻车了：exe 确实正常打印了版本号
        # 再退出（日志里能看到那行输出），但紧跟着的 $LASTEXITCODE 却是
        # 空值——pyinstaller_windows.spec 里这个 exe 是 console=False
        # （GUI 子系统，双击运行时不弹黑框，这是发布给用户用的正常形态），
        # 而 pwsh 的 `&` 调用操作符配合 $LASTEXITCODE 这套全局变量机制，
        # 对这种“运行极快就退出的 GUI 子系统进程”从 .NET Process 层面上
        # 就有已知的取值不可靠的问题（不是本项目代码的 bug，是 pwsh/.NET
        # 对这类进程退出码回读的老问题）。改用 Start-Process -PassThru
        # 拿到独立的 Process 对象读 .ExitCode，绕开 $LASTEXITCODE 这层。
        shell: pwsh
        run: |
          $exe = Resolve-Path "../YouTube Recorder/YouTube Recorder.exe"
          $outFile = Join-Path $env:TEMP "ytrec-version-stdout.txt"
          $errFile = Join-Path $env:TEMP "ytrec-version-stderr.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--version" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          Write-Host "--- stdout ---"; Get-Content $outFile -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content $errFile -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "packaged exe exited $($p.ExitCode) on --version"
            exit 1
          }

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path "../YouTube Recorder" `
            -DestinationPath "../YouTube-Recorder-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-Recorder-windows
          path: YouTube-Recorder-windows.zip
          retention-days: 14
